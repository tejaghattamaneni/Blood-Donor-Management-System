<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Add Donor</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div class="container d-flex justify-content-center align-items-center vh-100">
    <div class="card shadow p-4 w-100" style="max-width: 500px;">
      <h3 class="text-center mb-4">Add Donor</h3>
      <form method="POST">
        <div class="mb-3">
          <label for="name" class="form-label">Name</label>
          <input type="text" id="name" name="name" class="form-control" required placeholder="Enter your name">
        </div>

        <div class="mb-3">
          <label for="blood" class="form-label">Blood Group</label>
          <input list="bloodGroups" id="blood" name="blood" class="form-control" required placeholder="Select or type blood group">
          <datalist id="bloodGroups">
            <option value="A+">
            <option value="A-">
            <option value="B+">
            <option value="B-">
            <option value="AB+">
            <option value="AB-">
            <option value="O+">
            <option value="O-">
          </datalist>
        </div>

        <div class="mb-3">
          <label for="mobile" class="form-label">Mobile Number</label>
          <input type="tel" id="mobile" name="mobile" class="form-control" required placeholder="Enter your number">
        </div>

        <div class="mb-3">
          <label for="location" class="form-label">Location</label>
          <input type="text" id="location" name="location" class="form-control" required placeholder="Enter your location">
        </div>

        <div class="d-grid">
          <button type="submit" class="btn btn-primary">Submit</button>
        </div>
      </form>

      <div class="mt-3 text-center">
        <a href="/search">Search Donors by Location</a>
      </div>
    </div>
  </div>
</body>
</html>
